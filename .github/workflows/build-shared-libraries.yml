on: [push, pull_request]

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - run: ./build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libbc7-compressor-x64.so
          path: ./libbc7-compressor.so

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - run: ./build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libbc7-compressor-arm64.so
          path: ./libbc7-compressor.so

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - name: Build X64 DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /LD /O3 ^
            /I "%JAVA_HOME%\include" ^
            /I "%JAVA_HOME%\include\win32" ^
            compress_bc7.cpp ^
            /Febc7-compressor.dll
      - uses: actions/upload-artifact@v7
        with:
          name: bc7-compressor-x64.dll
          path: ./bc7-compressor.dll

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - name: Build ARM64 DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsarm64.bat"

          cl /LD /O3 ^
            /I "%JAVA_HOME%\include" ^
            /I "%JAVA_HOME%\include\win32" ^
            compress_bc7.cpp ^
            /Febc7-compressor.dll
      - uses: actions/upload-artifact@v7
        with:
          name: bc7-compressor-arm64.dll
          path: ./bc7-compressor.dll

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - run: ./build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bc7-compressor-arm64.dylib
          path: ./bc7-compressor.dylib

  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: "zulu"
      - run: ./build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bc7-compressor-x64.dylib
          path: ./bc7-compressor.dylib
